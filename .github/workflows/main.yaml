name: specializedProjects

on: 
  workflow_dispatch:
  push:
    branches: ["main"]
    
env:
  AWS_REGION: us-east-1

jobs:
  Testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarCloud Scan
        run: |
          dotnet sonarscanner begin \
            /k:"my-project-key" \
            /o:"my-org-key" \
            /d:sonar.login=${{ secrets.SONAR_TOKEN }} \
            /d:sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-incremental --configuration Release

      - name: Test with coverage
        run: dotnet test --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Convert coverage to OpenCover
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:TestResults/**/*.xml \
            -targetdir:coverage \
            -reporttypes:opencover

      - name: End SonarCloud Scan
        run: dotnet sonarscanner end /d:sonar.login=${{ secrets.SONAR_TOKEN }}

  Build-and-Push:
    runs-on: ubuntu-latest
    env:
      continue: 'false'
    strategy:
      matrix:
        service:
          - name: 'nguyenthanh91ndu1819/auction-svc'
            path: 'src/AuctionService'
          - name: 'nguyenthanh91ndu1819/bidding-svc'
            path: 'src/BiddingService'
          - name: 'nguyenthanh91ndu1819/buying-svc'
            path: 'src/BuyingService'
          - name: 'nguyenthanh91ndu1819/gateway-svc'
            path: 'src/GatewayService'
          - name: 'nguyenthanh91ndu1819/identity-svc'
            path: 'src/IdentityService'
          - name: 'nguyenthanh91ndu1819/notify-svc'
            path: 'src/NotificationService'
          - name: 'nguyenthanh91ndu1819/order-svc'
            path: 'src/OrderService'
          - name: 'nguyenthanh91ndu1819/search-svc'
            path: 'src/SearchService'
          - name: 'nguyenthanh91ndu1819/user-svc'
            path: 'src/UserService'
          - name: 'nguyenthanh91ndu1819/deposits-svc'
            path: 'src/WalletService'
          - name: 'nguyenthanh91ndu1819/web-app'
            path: 'frontend/web'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with: 
          fetch-depth: 2
      
      - name: Check for change
        run: |
          if git diff --quiet HEAD^ HEAD -- ${{ matrix.service.path }}; then
            echo "No change in ${{ matrix.service.path }}. Skipping build"
            echo "continue=false" >> $GITHUB_ENV
          else
            echo "Changes detected in ${{ matrix.service.path }}. Proceeding with build"
            echo "continue=true" >> $GITHUB_ENV
          fi

      - name: Set up Docker buildx
        if: env.continue == 'true'
        uses: docker/setup-buildx-action@v3
    
      - name: Login to Docker
        if: env.continue == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
    
      - name: Build and push docker image
        if: env.continue == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.path }}/Dockerfile
          push: true
          tags: ${{ matrix.service.name }}:latest 
