name: CI & Security Scan

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'terraform/**'
      - '**.md'
      - 'infrastructure/istio/**'
  pull_request:
    branches: ["main"]
  workflow_dispatch: # Cho phép chạy thủ công khi cần

permissions:
  contents: write
  security-events: write
  actions: read

jobs:
  # ----------------------------------------------------------------
  # JOB 1: TESTING & SONARCLOUD
  # ----------------------------------------------------------------
  Testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarCloud Scan
        run: |
          dotnet sonarscanner begin \
          /k:"${{ secrets.SONAR_PROJECT_KEY }}" \
          /o:"${{ secrets.SONAR_ORG_KEY }}" \
          /d:sonar.login=${{ secrets.SONAR_TOKEN }} \
          /d:sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-incremental --configuration Release

      - name: End SonarCloud Scan
        run: dotnet sonarscanner end /d:sonar.login=${{ secrets.SONAR_TOKEN }}

  # ----------------------------------------------------------------
  # JOB 2: BUILD AND PUSH DOCKER IMAGES
  # ----------------------------------------------------------------
  Build-and-Push:
    needs: Testing
    runs-on: ubuntu-latest
    outputs:
      image_version: ${{ steps.set_version.outputs.version }}
    strategy:
      fail-fast: false # Đảm bảo 1 service lỗi không dừng các service khác
      matrix:
        service:
          - { name: "nguyenthanh91ndu/auction-svc", path: "src/AuctionService" }
          - { name: "nguyenthanh91ndu/bidding-svc", path: "src/BiddingService" }
          - { name: "nguyenthanh91ndu/buying-svc", path: "src/BuyingService" }
          - { name: "nguyenthanh91ndu/gateway-svc", path: "src/GatewayService" }
          - { name: "nguyenthanh91ndu/identity-svc", path: "src/IdentityService" }
          - { name: "nguyenthanh91ndu/notify-svc", path: "src/NotificationService" }
          - { name: "nguyenthanh91ndu/order-svc", path: "src/OrderService" }
          - { name: "nguyenthanh91ndu/search-svc", path: "src/SearchService" }
          - { name: "nguyenthanh91ndu/user-svc", path: "src/UserService" }
          - { name: "nguyenthanh91ndu/deposits-svc", path: "src/WalletService" }
          - { name: "nguyenthanh91ndu/web-app", path: "frontend/web" }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set image version
        id: set_version
        run: |
          VERSION=v${{ github.run_number }}
          echo "IMAGE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check for change
        id: check_change
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "continue=true" >> $GITHUB_ENV
          elif git diff --quiet HEAD^ HEAD -- ${{ matrix.service.path }}; then
            echo "No change in ${{ matrix.service.path }}. Skipping build"
            echo "continue=false" >> $GITHUB_ENV
          else
            echo "Changes detected. Proceeding with build"
            echo "continue=true" >> $GITHUB_ENV
          fi

      - name: Set up Docker buildx
        if: env.continue == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker
        if: env.continue == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push docker image
        if: env.continue == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.path }}/Dockerfile
          push: true
          tags: |
            ${{ matrix.service.name }}:${{ env.IMAGE_VERSION }}
            ${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------
  # JOB 3: TRIVY SECURITY SCAN
  # ----------------------------------------------------------------
  Trivy-Security-Scan:
    needs: Build-and-Push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: "nguyenthanh91ndu/auction-svc"
          - name: "nguyenthanh91ndu/bidding-svc"
          - name: "nguyenthanh91ndu/buying-svc"
          - name: "nguyenthanh91ndu/gateway-svc"
          - name: "nguyenthanh91ndu/identity-svc"
          - name: "nguyenthanh91ndu/notify-svc"
          - name: "nguyenthanh91ndu/order-svc"
          - name: "nguyenthanh91ndu/search-svc"
          - name: "nguyenthanh91ndu/user-svc"
          - name: "nguyenthanh91ndu/deposits-svc"
          - name: "nguyenthanh91ndu/web-app"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set Date
        run: echo "DATE=$(date +%m.%d.%Y)" >> $GITHUB_ENV

      - name: Set sanitized service name
        id: sanitize
        run: |
          SAFE_NAME=$(echo "${{ matrix.service.name }}" | tr '/' '-')
          echo "safe_name=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: Create output directory
        run: mkdir -p "trivy-reports"

      - name: Run Trivy vulnerability scanner (JSON & SARIF)
        run: |
          # Cài đặt nhanh Trivy
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

          # Quét định dạng JSON để làm báo cáo
          trivy image --format json --ignore-unfixed --severity CRITICAL,HIGH,MEDIUM,LOW \
            -o "trivy-reports/scan-${{ steps.sanitize.outputs.safe_name }}-${{ env.DATE }}.json" \
            ${{ matrix.service.name }}:latest

          # Quét định dạng SARIF cho GitHub Security
          trivy image --format sarif --ignore-unfixed --severity CRITICAL,HIGH \
            -o "trivy-reports/scan-${{ steps.sanitize.outputs.safe_name }}-${{ env.DATE }}.sarif" \
            ${{ matrix.service.name }}:latest

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-reports/scan-${{ steps.sanitize.outputs.safe_name }}-${{ env.DATE }}.sarif"
          category: ${{ steps.sanitize.outputs.safe_name }}

      - name: Upload scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ steps.sanitize.outputs.safe_name }}
          path: trivy-reports/
          retention-days: 7

  # ----------------------------------------------------------------
  # JOB 4: NOTIFY OR LOGGING (Tùy chọn)
  # ----------------------------------------------------------------
  Post-Build-Summary:
    needs: Trivy-Security-Scan
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: echo "CI process completed successfully for all services."
