apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: order-svc-dr
  namespace: backend
spec:
  host: order-clusterip.backend.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        idleTimeout: 2m
      http:
        idleTimeout: 2m
        maxRequestsPerConnection: 100
    tls:
      mode: ISTIO_MUTUAL
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: order-vs
spec:
  hosts:
  - order-clusterip.backend.svc.cluster.local
  http:
  - route: 
    - destination:
        host: order-clusterip.backend.svc.cluster.local
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: gateway-error,connect-failure,refused-stream