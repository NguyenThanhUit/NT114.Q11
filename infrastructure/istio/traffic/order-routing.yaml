apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: order-vs
  namespace: backend
spec:
  hosts:
  - order-clusterip.backend.svc.cluster.local
  http:
  - timeout: 60s                     # Tăng lên 60s cho order service (có thể xử lý lâu)
    retries:
      attempts: 3                    # Tăng lên 3 lần thử
      perTryTimeout: 20s             # 20s mỗi lần
      retryOn: connect-failure,refused-stream,unavailable,cancelled,retriable-status-codes,5xx
    route:
    - destination:
        host: order-clusterip.backend.svc.cluster.local
        port:
          number: 80                 # Thêm port number
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: order-dr
  namespace: backend
spec:
  host: order-clusterip.backend.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL            
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 1000
        connectTimeout: 30s
      http:
        http1MaxPendingRequests: 1024
        http2MaxRequests: 1024
        maxRequestsPerConnection: 100
        idleTimeout: 3600s
        h2UpgradePolicy: UPGRADE
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
