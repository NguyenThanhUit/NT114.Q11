apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - app.nguyenth4nh.id.vn
    - api.nguyenth4nh.id.vn
    - id.nguyenth4nh.id.vn
    tls:
      mode: SIMPLE
      credentialName: multi-tls
