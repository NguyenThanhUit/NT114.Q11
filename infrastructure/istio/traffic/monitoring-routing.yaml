apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: kiali-vs
  namespace: istio-system
spec:
  hosts:
  - kiali.nguyenth4nh.id.vn
  gateways:
  - main-gateway
  http:
  - route:
    - destination:
        host: kiali
        port:
          number: 20001
---
