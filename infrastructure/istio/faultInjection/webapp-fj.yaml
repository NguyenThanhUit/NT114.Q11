apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: webapp-fault-injection-vs
  namespace: frontend
spec:
  hosts:
    - app.nguyenth4nh.id.vn
  gateways:
    - istio-system/main-gateway
  http:
    # /products route - 10% fault injection
    - match:
        - uri:
            prefix: "/products"
      fault:
        abort:
          httpStatus: 500
          percentage:
            value: 10.0
      route:
        - destination:
            host: webapp-clusterip.frontend.svc.cluster.local
            port:
              number: 3000
      timeout: 5s
      retries:
        attempts: 2
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,reset
    
    # /users route - no fault
    - match:
        - uri:
            prefix: "/users"
      route:
        - destination:
            host: webapp-clusterip.frontend.svc.cluster.local
            port:
              number: 3000
      timeout: 5s
      retries:
        attempts: 2
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,reset
    
    # /auctions route - 20% fault injection
    - match:
        - uri:
            prefix: "/auctions"
      fault:
        abort:
          httpStatus: 500
          percentage:
            value: 20.0
      route:
        - destination:
            host: webapp-clusterip.frontend.svc.cluster.local
            port:
              number: 3000
      timeout: 5s
      retries:
        attempts: 2
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,reset
    
    # Default route - all other paths
    - route:
        - destination:
            host: webapp-clusterip.frontend.svc.cluster.local
            port:
              number: 3000
      timeout: 60s
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: webapp-dr
  namespace: frontend
spec:
  host: webapp-clusterip.frontend.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50