apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: webapp-vs
  namespace: frontend
spec:
  hosts:
    - app.nguyenth4nh.id.vn
  gateways:
    - istio-system/main-gateway
  http:
    - match:
        - headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: webapp-clusterip.frontend.svc.cluster.local
            port:
              number: 3000
            subset: green
      timeout: 60s
    
    # Edge users -> blue (v56) - CHECK TRƯỚC CHROME
    - match:
        - headers:
            user-agent:
              regex: ".*Edg/.*"
      route:
        - destination:
            host: webapp-clusterip.frontend.svc.cluster.local
            port:
              number: 3000
            subset: blue
      timeout: 60s
    
    # Chrome users (not Edge) -> green (latest)
    - match:
        - headers:
            user-agent:
              regex: ".*Chrome.*"
      route:
        - destination:
            host: webapp-clusterip.frontend.svc.cluster.local
            port:
              number: 3000
            subset: green
      timeout: 60s
    
    # Firefox users -> green (latest)
    - match:
        - headers:
            user-agent:
              regex: ".*Firefox.*"
      route:
        - destination:
            host: webapp-clusterip.frontend.svc.cluster.local
            port:
              number: 3000
            subset: green
      timeout: 60s
    
    # Safari users -> blue (v56) - Safari không có Chrome trong UA
    - match:
        - headers:
            user-agent:
              regex: ".*Safari.*"
      route:
        - destination:
            host: webapp-clusterip.frontend.svc.cluster.local
            port:
              number: 3000
            subset: blue
      timeout: 60s
    
    # Mobile browsers -> blue (v56)
    - match:
        - headers:
            user-agent:
              regex: ".*(Mobile|Android|iPhone|iPad).*"
      route:
        - destination:
            host: webapp-clusterip.frontend.svc.cluster.local
            port:
              number: 3000
            subset: blue
      timeout: 60s
    
    # Default fallback -> blue (v56)
    - route:
        - destination:
            host: webapp-clusterip.frontend.svc.cluster.local
            port:
              number: 3000
            subset: blue
      timeout: 60s
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: webapp-dr
  namespace: frontend
spec:
  host: webapp-clusterip.frontend.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      consistentHash:
        httpCookie:
          name: webapp-sticky
          ttl: 3600s
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50

  subsets:
    - name: blue
      labels:
        version: v56
    - name: green
      labels:
        version: latest