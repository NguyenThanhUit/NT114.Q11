apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: multi-domain-cert
  namespace: istio-system
spec:
  secretName: multi-domain-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - app.nguyenth4nh.id.vn
  - api.nguyenth4nh.id.vn
  - id.nguyenth4nh.id.vn
  - kiali.nguyenth4nh.id.vn
  - prometheus.nguyenth4nh.id.vn
  - grafana.nguyenth4nh.id.vn
  - argocd.nguyenth4nh.id.vn