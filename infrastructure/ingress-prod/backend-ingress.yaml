apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: backend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod   # dùng ClusterIssuer Let's Encrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.nguyenth4nh.id.vn
      secretName: api-nguyenth4nh-tls
    - hosts:
        - id.nguyenth4nh.id.vn
      secretName: id-nguyenth4nh-tls
  rules:
    - host: api.nguyenth4nh.id.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-clusterip
                port:
                  number: 80
    - host: id.nguyenth4nh.id.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: identity-clusterip
                port:
                  number: 80
