apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-svc
  namespace: backend
  labels:
    app: order-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: order-svc
    spec:
      initContainers:
        - name: wait-for-postgres
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              apk add --no-cache netcat-openbsd
              echo "Waiting for PostgreSQL..."
              until nc -zv postgres-clusterip.backend.svc.cluster.local 5432; do
                echo "PostgreSQL not ready, retrying in 20s..."
                sleep 20
              done
              echo "PostgreSQL is ready!"
        - name: wait-for-rabbitmq
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              apk add --no-cache netcat-openbsd
              echo "Waiting for RabbitMQ..."
              until nc -zv rabbit-clusterip.backend.svc.cluster.local 5672; do
                echo "RabbitMQ not ready, retrying in 20s..."
                sleep 20
              done
              echo "RabbitMQ is ready!"
      containers:
        - name: order-svc
          image: nguyenthanh/order-svc
          imagePullPolicy: Never
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: order-secret
                  key: connString
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: rabbit-secret
                  key: username
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: rabbit-secret
                  key: password
          envFrom:
            - configMapRef:
                name: order-svc-config
          ports:
            - containerPort: 80
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: order-clusterip
  namespace: backend
spec:
  selector:
    app: order-svc
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http